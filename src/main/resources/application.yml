server:
  port: 7080

spring:
  application:
    name: xiaoxiaoshu-ai
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/xiaoxiaoshu_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  mvc:
    async:
      request-timeout: 300000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:no-key-demo-mode}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-6-luna}
          temperature: 0.7
    retry:
      max-attempts: 1

app:
  ai:
    model: openai  # 默认使用 OpenAI，可改为 deepseek
    mock-mode: ${DEEPSEEK_API_KEY:}  # 留空时自动进入本地演示模式
  web-search:
    enabled: true
    timeout-seconds: 8
  storage:
    endpoint: http://127.0.0.1:9000
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: xiaoxiaoshu-ai
    max-image-bytes: 10485760
  mcp:
    enabled: true
    connect-timeout-seconds: 3
    request-timeout-seconds: 15
    retry-cooldown-seconds: 60
    servers:
      qq:
        label: 小小书 QQ 资料 MCP Server
        url: ${QQ_MCP_URL:http://127.0.0.1:7081/mcp}
      amap:
        label: 高德地图 MCP Server
        enabled: ${AMAP_MCP_ENABLED:false}
        url: ${AMAP_MCP_URL:https://mcp.amap.com/mcp}
  models:
    default-provider: deepseek
    providers:
      openai:
        label: OpenAI GPT-4
        type: openai
        api-key: ${OPENAI_API_KEY:}
        base-url: https://api.openai.com
        model: gpt-4
        enabled: ${OPENAI_ENABLED:false}
      ollama:
        label: Ollama 本地模型
        type: ollama
        api-key: ollama
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
        model: ${OLLAMA_MODEL:llama3.1}
        enabled: ${OLLAMA_ENABLED:false}

logging:
  level:
    com.quanxiaoha.xiaoxiaoshu.ai: info
    org.springframework.ai.chat.client.advisor: info
    io.modelcontextprotocol: warn
